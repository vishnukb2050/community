name: community_app
description: Community & Personal Management Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  
  # State Management
  provider: ^6.1.1
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9
  
  # HTTP & Networking
  dio: ^5.4.0
  web_socket_channel: ^2.4.0
  socket_io_client: ^2.0.3
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  
  # OCR & Camera
  google_ml_kit: ^0.16.3
  camera: ^0.10.5+7
  # image_picker: ^1.0.5
  
  # Charts & UI Components
  fl_chart: ^0.65.0
  intl: ^0.18.1
  cached_network_image: ^3.3.0
  
  # Firebase (Push Notifications)
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9
  
  # Calendar & Contacts
  table_calendar: ^3.0.9
  flutter_contacts: ^1.1.7
  permission_handler: ^11.0.1
  
  # Utilities
  uuid: ^4.2.1
  path_provider: ^2.1.1
  file_picker: ^6.1.1
  url_launcher: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  archive: ^4.0.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    

